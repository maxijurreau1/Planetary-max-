name = "planetary-max-sovereign"
main = "src/worker.ts"
compatibility_date = "2026-03-01"

[assets]
directory = "../dist"
binding = "ASSETS"

[[durable_objects.bindings]]
name = "MATCH_ROOM"
class_name = "MatchRoom"

[[migrations]]
tag = "v1-match-room"
new_sqlite_classes = ["MatchRoom"]

[[d1_databases]]
binding = "DB"
database_name = "max-empire-db"
database_id = "REPLACE_WITH_YOUR_CLOUDFLARE_D1_DATABASE_ID"
migrations_dir = "."
