name = "planetary-max"
main = "server/planetary-max.ts"
compatibility_date = "2026-11-10"

[vars]
ENVIRONMENT = "production"

[[d1_databases]]
binding = "DB"
database_name = "beemax-production-db"
database_id = "5a8e3def-a8ef-4fda-907f-20bc5f24a501"

[[kv_namespaces]]
binding = "SESSION_KV"
namespace_id = "7e90756b6ea84160b91bcea3a7e4d3c7"

[[durable_objects.bindings]]
name = "NODE_REGISTRY"
class_name = "NodeRegistryDO"

[[durable_objects.bindings]]
name = "BEEMAX_SECURE_REGISTRY"
class_name = "BEEMAXSecureNodeRegistryDO"

[[migrations]]
tag = "v1-node-registry"
new_sqlite_classes = ["NodeRegistryDO"]

[[migrations]]
tag = "v2-secure-registry"
new_sqlite_classes = ["BEEMAXSecureNodeRegistryDO"]

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
