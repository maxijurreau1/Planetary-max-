#:schema node_modules/wrangler/config-schema.json
name = "beemax-portal-os1"
main = "src/index.ts"
compatibility_date = "2026-11-01"
compatibility_flags = ["nodejs_compat"]

[vars]
ENVIRONMENT = "production"
PROTOCOL_VERSION = "DAT-JURREAUISM-v1"
PRE_TIER_INDEX = "IDX-PRETIER-001"
ISOLATE_MEMORY_LIMIT_MB = "128"

# ----------------------------------------------------------------------------
# 1. DURABLE OBJECTS COGNITIVE MESH (SQLite-Backed ICV Actors)
# ----------------------------------------------------------------------------
[[durable_objects.bindings]]
name = "BEEMAX_MESH_STATE"
class_name = "CognitiveNodeActor"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["CognitiveNodeActor"]

# ----------------------------------------------------------------------------
# 2. UNIFIED CLOUDFLARE D1 DATABASE (Microkernel Logs + Sovereign Marketplace)
# ----------------------------------------------------------------------------
[[d1_databases]]
binding = "DB"
database_name = "beemax-db"
database_id = "REPLACE_WITH_YOUR_CLOUDFLARE_D1_DATABASE_ID"
migrations_dir = "src/database"
